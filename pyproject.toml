[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-docs-plus"
dynamic = ["version"]
description = "Enhanced interactive API docs for FastAPI: AI parameter filling + Python-side pre-request hooks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["fastapi", "swagger", "openapi", "docs", "ai", "llm"]
authors = [
    {name = "left666"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Documentation",
]
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "jsonschema>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/left666/fastapi-docs-plus"
Repository = "https://github.com/left666/fastapi-docs-plus"

[tool.setuptools]
packages = ["fastapi_docs_plus", "fastapi_docs_plus.static"]
package-dir = {"fastapi_docs_plus" = "."}

[tool.setuptools.package-data]
fastapi_docs_plus = [
    "static/adapter.js",
    "static/docs-plus.css",
    "static/docs-plus.js",
    "static/docs.html",
]

[tool.setuptools_scm]
local_scheme = "no-local-version"
fallback_version = "0.0.0"